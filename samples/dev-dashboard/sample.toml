anchor = "cli dispatch"
text = '''
Command::Bench(args) => kernel::dashboard::cli::bench(&config, args).await,
Command::Test(args) => kernel::dashboard::cli::test(&config, args).await,
Command::Dashboard { command } => {
    let db = kernel::db::connect(&config.database_url, config.database_pool).await?;
    kernel::dashboard::cli::run(&config, &db, command).await
}
