name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (POSIX sh tools)
        run: shellcheck tools/*.sh
      - name: Every SECURITY marker and CHECKS.md row cites a test that exists
        run: tools/security-check.sh
      - name: install.sh resolves dependencies (diamonds, installed samples, cycles)
        run: tools/install-test.sh

  samples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "host -> ../.cache/target" }
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit
      - name: Vendor the framework release (checksum-verified)
        run: tools/vendor-framework.sh host
      - name: The host alone (the baseline every sample starts from)
        working-directory: host
        run: |
          bin/setup-tailwind && bin/tailwindcss -i assets/app.css -o static/app.css --minify
          sh .offrails/tools/offrails-check
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo nextest run --locked
      - name: Every sample alone, then all together (SQLite and Postgres; clippy, cargo deny, cargo audit)
        run: tools/ci.sh

  windows-app:                  # every sample installed (POSIX tools), for the Windows job to build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: tools/vendor-framework.sh host
      - name: Install every sample into one app (cargo fmt, CSS; no build)
        run: tools/ci.sh --prepare all
      - name: Pack it (tar keeps modes and LF line endings)
        run: tar -C .cache/ci/all -czf all-app.tar.gz app
      - uses: actions/upload-artifact@v7
        with: { name: all-app, path: all-app.tar.gz, retention-days: 3 }

  windows:                      # Windows found real bugs (a cfg(unix)-only const, a file renamed while open)
    needs: windows-app
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/download-artifact@v7
        with: { name: all-app }
      - run: tar -xzf all-app.tar.gz
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "app -> ../target" }
      - uses: taiki-e/install-action@nextest
      - name: clippy -D warnings (all targets), and no unwrap/expect in shipped code
        working-directory: app
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Every sample's tests on SQLite
        working-directory: app
        run: |
          cargo run -q --locked -- routes > /dev/null
          cargo nextest run --locked --no-fail-fast --status-level fail --final-status-level fail

  e2e:                          # a real browser through boosted links: every interactive page works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "host -> ../.cache/target" }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm (the version tools/screenshots/package.json pins)
        run: corepack enable
      - run: tools/vendor-framework.sh host
      - name: Every sample in the demo; auth pages and the live room reached through boosted links (Google Chrome)
        run: tools/e2e.sh
      - if: failure()
        run: tail -80 demo/demo.log || true

  zap:                          # OWASP ZAP baseline against every sample installed, in production mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "host -> ../.cache/target" }
      - run: tools/vendor-framework.sh host
      # APP_ENV=production with fresh random secrets, email logged, admin views off (their default),
      # no /dev tools: the surface a deployed app exposes (security.md, Automated enforcement).
      - name: Start the app in production mode (all samples, migrated and seeded)
        run: tools/demo.sh all --port 3900 --production
      - name: ZAP baseline (fails on any WARN not triaged in .zap/rules.tsv)
        run: |
          chmod 777 .zap
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3900 -c rules.tsv -r zap-report.html -m 2
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: zap-report, path: .zap/zap-report.html, if-no-files-found: ignore }
      - if: always()
        run: tail -50 demo/demo.log || true
      - if: always()
        run: tools/demo.sh stop

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets in any commit)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
